name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. This workflow only ever reads the tree; nothing here needs
# write scope, and no step interpolates untrusted event data into a shell.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install` — fails loudly if the lockfile drifts from
      # package.json rather than silently resolving new versions.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Vercel builds too, but only after merge for master; this gates the PR.
      - name: Build
        run: npm run build
