name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. This workflow only ever reads the tree; nothing here needs
# write scope, and no step interpolates untrusted event data into a shell.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned: a tag is mutable, and this is a public repo. v4 ran on the
      # node20 action runtime, which GitHub is retiring; v7 runs on node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vercel builds this project on Node 24; match it so the gate tests
          # the runtime prod actually uses.
          node-version: 24
          cache: npm

      # `ci` not `install` — fails loudly if the lockfile drifts from
      # package.json rather than silently resolving new versions.
      # `--ignore-scripts` because a transitive dep (unrs-resolver, via
      # eslint-config-next) runs an install script; nothing here needs it.
      - run: npm ci --ignore-scripts

      # Warnings must fail too. exhaustive-deps and no-unused-vars are
      # warn-severity in eslint-config-next, so without this the gate ignores
      # the most common React bug class. Kept as a CI flag, not a package.json
      # change, so local `npm run lint` stays advisory.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # Build BEFORE typecheck: next-env.d.ts and .next/types/** are gitignored
      # and generated by `next build`, and tsconfig.json includes both. On a cold
      # checkout `tsc` alone sees a smaller program with no Next ambient types —
      # verified that `PageProps<"/route">` fails TS2304 cold and passes after a
      # build. Vercel also builds PRs, but this is the only *blocking* build.
      - name: Build
        run: npm run build

      # Redundant with the build's own tsc for most errors, kept because it also
      # covers files the build tree-shakes out of the program.
      - name: Typecheck
        run: npx tsc --noEmit
